<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SiberGaraj lüks araç kiralama</title>
  <desc id="desc">Gece ışıkları altında altın renkli spor otomobil ve motosiklet</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b2a"/><stop offset=".58" stop-color="#090e17"/><stop offset="1" stop-color="#17120a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fff0a5"/><stop offset=".28" stop-color="#f8c542"/><stop offset=".7" stop-color="#c98512"/><stop offset="1" stop-color="#ffe27b"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38506a"/><stop offset="1" stop-color="#101925"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#181d24"/><stop offset="1" stop-color="#06080c"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#e7a91c" stop-opacity=".25"/><stop offset="1" stop-color="#e7a91c" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
